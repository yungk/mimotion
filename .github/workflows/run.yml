name: 刷步数

on:
  schedule:
    # 北京时间 11:23 / 11:48 执行，12:17 兜底（避开整点高峰，防止 GitHub 丢弃定时任务）
    - cron: '23 3 * * *'
    - cron: '48 3 * * *'
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
            FIXED_STEP_RANGE: ${{ vars.FIXED_STEP_RANGE }}
        run: |
          pip3 install -r requirements.txt
          # 华米接口偶尔连接超时，失败时最多重试 5 次
          for i in 1 2 3 4 5; do
            python3 -u main.py | tee /tmp/mimotion.log
            if grep -q "失败：0" /tmp/mimotion.log; then echo "刷步成功"; exit 0; fi
            echo "第 $i 次失败，60 秒后重试"
            sleep 60
          done
          echo "多次重试仍失败"
          exit 1

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master
